name: Diagnose v1.0.41 tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: arm64
      - name: Restore dependencies
        run: |
          dotnet restore MacExplorer.csproj
          dotnet restore Tests/MacExplorer.Tests/MacExplorer.Tests.csproj
      - name: Run tests with failure details
        run: dotnet test Tests/MacExplorer.Tests/MacExplorer.Tests.csproj -c Release --no-restore -p:SkipMacOSReleaseDMG=true -p:TestingPlatformShowTestsFailure=true
      - name: Print test logs
        if: always()
        run: find Tests/MacExplorer.Tests/bin/Release -path '*/TestResults/*.log' -type f -exec cat {} \;
