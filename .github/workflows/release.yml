name: Release Mac Explorer

"on":
  push:
    branches:
      - main
    paths:
      - MacExplorer.csproj
  workflow_dispatch:
    inputs:
      sync_backend_only:
        description: Sync the existing release to the backend without rebuilding
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mac-explorer-release
  cancel-in-progress: false

env:
  PROJECT_FILE: MacExplorer.csproj
  TEST_PROJECT: Tests/MacExplorer.Tests/MacExplorer.Tests.csproj
  BACKEND_BASE_URL: http://thankful.top:4396
  BACKEND_CLIENT: MacExplorer

jobs:
  detect-version:
    name: Detect release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare project version with release tags
        id: version
        shell: bash
        env:
          SYNC_BACKEND_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_backend_only == true }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          project_file = Path(os.environ["PROJECT_FILE"])
          root = ET.parse(project_file).getroot()
          version_text = next(
              (
                  element.text.strip()
                  for element in root.iter()
                  if element.tag.rsplit("}", 1)[-1] == "Version"
                  and element.text
                  and element.text.strip()
              ),
              "",
          )

          version_pattern = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")
          if not version_pattern.fullmatch(version_text):
              sys.exit(
                  f"MacExplorer.csproj Version must use X.Y.Z numeric format; got {version_text!r}"
              )

          def parse(value: str) -> tuple[int, int, int]:
              return tuple(int(part) for part in value.split("."))

          raw_tags = subprocess.check_output(
              ["git", "tag", "--list", "v*"], text=True
          ).splitlines()
          release_tags = {
              tag: parse(tag[1:])
              for tag in raw_tags
              if version_pattern.fullmatch(tag[1:])
          }
          ordered_tags = sorted(release_tags, key=release_tags.get, reverse=True)
          latest_tag = ordered_tags[0] if ordered_tags else ""
          latest_version = release_tags.get(latest_tag)
          current_version = parse(version_text)
          current_tag = f"v{version_text}"
          sync_only = os.environ.get("SYNC_BACKEND_ONLY", "false").lower() == "true"

          if sync_only:
              if not latest_tag:
                  sys.exit("Backend-only sync requires an existing release tag")
              if current_tag not in release_tags:
                  sys.exit(f"Backend-only sync requires existing tag {current_tag}")
              if current_tag != latest_tag:
                  sys.exit(
                      f"Backend-only sync is only allowed for the highest tag {latest_tag}; "
                      f"the project currently declares {current_tag}"
                  )
              mode = "sync"
          elif latest_version is None or current_version > latest_version:
              mode = "publish"
          elif current_version == latest_version:
              mode = "noop"
          else:
              sys.exit(
                  f"Project version {version_text} is lower than the highest release tag "
                  f"{latest_tag}"
              )

          previous_candidates = [
              tag for tag in ordered_tags if release_tags[tag] < current_version
          ]
          previous_tag = previous_candidates[0] if previous_candidates else ""

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"mode={mode}\n")
              output.write(f"version={version_text}\n")
              output.write(f"tag={current_tag}\n")
              output.write(f"previous_tag={previous_tag}\n")

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("## Version detection\n\n")
              summary.write(f"- Project version: `{version_text}`\n")
              summary.write(f"- Highest release tag: `{latest_tag or 'none'}`\n")
              summary.write(f"- Mode: `{mode}`\n")
          PY

      - name: Test full release memo generation
        run: python3 -m unittest discover -s Tools/Release -p 'test_*.py' -v

  publish-release:
    name: Build and publish release
    needs: detect-version
    if: needs.detect-version.outputs.mode == 'publish'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: arm64

      - name: Restore dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore "$PROJECT_FILE"
          dotnet restore "$TEST_PROJECT"

      - name: Run tests
        shell: bash
        run: bash Tools/Testing/run-isolated.sh dotnet test "$TEST_PROJECT" -c Release --no-restore -p:SkipMacOSReleaseDMG=true -p:TestingPlatformShowTestsFailure=true

      - name: Publish application
        shell: bash
        run: dotnet publish "$PROJECT_FILE" -c Release --no-restore

      - name: Package and verify release assets
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail

          build_root="bin/Release/net10.0/osx-arm64"
          app_path="${build_root}/Mac Explorer.app"
          dmg_path="${build_root}/MacExplorer-${VERSION}-macos.dmg"
          dmg_name="MacExplorer-${VERSION}-macos.dmg"
          zip_name="MacExplorer-${VERSION}-macos.zip"
          dist_dir="${RUNNER_TEMP}/mac-explorer-release"
          verify_dir="${RUNNER_TEMP}/mac-explorer-zip-verify"

          test -d "$app_path"
          test -f "$dmg_path"

          plist_path="${app_path}/Contents/Info.plist"
          executable_path="${app_path}/Contents/MacOS/MacExplorer"
          test -f "$plist_path"
          test -x "$executable_path"

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist_path")
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist_path")
          test "$bundle_id" = "com.macexplorer.app"
          test "$bundle_version" = "$VERSION"
          codesign --verify --deep --strict "$app_path"

          rm -rf "$dist_dir" "$verify_dir"
          mkdir -p "$dist_dir" "$verify_dir"
          cp "$dmg_path" "${dist_dir}/${dmg_name}"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "${dist_dir}/${zip_name}"

          ditto -x -k "${dist_dir}/${zip_name}" "$verify_dir"
          zipped_app="${verify_dir}/Mac Explorer.app"
          test -d "$zipped_app"
          test -x "${zipped_app}/Contents/MacOS/MacExplorer"
          codesign --verify --deep --strict "$zipped_app"

          echo "dist_dir=$dist_dir" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$dmg_name" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect-version.outputs.tag }}
          DIST_DIR: ${{ steps.package.outputs.dist_dir }}
          DMG_NAME: ${{ steps.package.outputs.dmg_name }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            "${DIST_DIR}/${DMG_NAME}" \
            "${DIST_DIR}/${ZIP_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mac Explorer ${TAG}" \
            --generate-notes \
            --latest

          release_json=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets)
          jq -e --arg name "$DMG_NAME" '.assets | any(.name == $name)' <<< "$release_json"
          jq -e --arg name "$ZIP_NAME" '.assets | any(.name == $name)' <<< "$release_json"

  sync-backend:
    name: Sync release to update backend
    needs:
      - detect-version
      - publish-release
    if: >-
      always() &&
      (needs.detect-version.outputs.mode == 'sync' ||
       (needs.detect-version.outputs.mode == 'publish' && needs.publish-release.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and validate release asset
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect-version.outputs.version }}
          TAG: ${{ needs.detect-version.outputs.tag }}
        run: |
          set -euo pipefail

          zip_name="MacExplorer-${VERSION}-macos.zip"
          release_json=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease)

          jq -e '.isDraft == false and .isPrerelease == false' <<< "$release_json" > /dev/null
          zip_url=$(jq -r --arg name "$zip_name" '.assets[] | select(.name == $name) | .url' <<< "$release_json")
          if [[ -z "$zip_url" || "$zip_url" == "null" ]]; then
            echo "Release $TAG does not contain $zip_name" >&2
            exit 1
          fi

          curl --fail --silent --show-error --location --head \
            --connect-timeout 10 --max-time 60 \
            "$zip_url" > /dev/null

          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "zip_url=$zip_url" >> "$GITHUB_OUTPUT"

      - name: Generate backend memo
        id: memo
        shell: bash
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
          TAG: ${{ needs.detect-version.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.detect-version.outputs.previous_tag }}
        run: |
          set -euo pipefail

          memo_file="${RUNNER_TEMP}/backend-memo.txt"
          python3 Tools/Release/generate_memo.py \
            --version "$VERSION" --tag "$TAG" --previous-tag "$PREVIOUS_TAG" \
            --output "$memo_file"

          echo "memo_file=$memo_file" >> "$GITHUB_OUTPUT"

      - name: Insert and verify backend version
        shell: bash
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
          ZIP_URL: ${{ steps.release.outputs.zip_url }}
          MEMO_FILE: ${{ steps.memo.outputs.memo_file }}
        run: |
          set -euo pipefail

          current_response=$(curl --fail --silent --show-error --get \
            --connect-timeout 10 --max-time 60 \
            --data-urlencode "Client=${BACKEND_CLIENT}" \
            "${BACKEND_BASE_URL}/api/CloudSync/GetVersion")

          jq -e '.success == true and .data != null' \
            <<< "$current_response" > /dev/null

          backend_version=$(jq -r '.data.VERSION // empty' <<< "$current_response")
          backend_path=$(jq -r '.data.PATH // empty' <<< "$current_response")

          if [[ "$backend_version" == "$VERSION" && "$backend_path" == "$ZIP_URL" ]]; then
            if jq -e --rawfile memo "$MEMO_FILE" '.data.MEMO == $memo' <<< "$current_response" > /dev/null; then
              echo "Backend version, ZIP URL and full memo already match; skipping write."
              exit 0
            fi
          else

          python3 - "$backend_version" "$VERSION" <<'PY'
          import re
          import sys

          current, target = sys.argv[1:]
          pattern = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")
          if not current:
              raise SystemExit(0)
          if not pattern.fullmatch(current):
              raise SystemExit(f"Backend returned an invalid version: {current!r}")
          if tuple(map(int, current.split("."))) >= tuple(map(int, target.split("."))):
              raise SystemExit(
                  f"Backend version {current} is not lower than target {target}; refusing duplicate insert"
              )
          PY
          fi

          payload_file="${RUNNER_TEMP}/save-version-payload.json"
          jq -n --arg client "$BACKEND_CLIENT" --arg version "$VERSION" \
            --arg path "$ZIP_URL" --rawfile memo "$MEMO_FILE" \
            '{Client: $client, Version: $version, Path: $path, Memo: $memo}' > "$payload_file"

          response_file="${RUNNER_TEMP}/save-version-response.json"
          http_code=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data-binary "@${payload_file}" \
            "${BACKEND_BASE_URL}/api/CloudSync/SaveVersion")

          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "SaveVersion returned HTTP $http_code; full memo was not confirmed saved." >&2
            cat "$response_file" >&2
            exit 1
          fi

          jq -e --arg client "$BACKEND_CLIENT" --arg version "$VERSION" \
            --arg path "$ZIP_URL" --rawfile memo "$MEMO_FILE" \
            '.success == true and .data.CLIENT == $client and .data.VERSION == $version and
             .data.PATH == $path and .data.MEMO == $memo' "$response_file" > /dev/null

          verify_response=$(curl --fail --silent --show-error --get \
            --connect-timeout 10 --max-time 60 \
            --data-urlencode "Client=${BACKEND_CLIENT}" \
            "${BACKEND_BASE_URL}/api/CloudSync/GetVersion")

          jq -e \
            --arg client "$BACKEND_CLIENT" \
            --arg version "$VERSION" \
            --arg path "$ZIP_URL" \
            --rawfile memo "$MEMO_FILE" \
            '.success == true and
             .data.CLIENT == $client and
             .data.VERSION == $version and
             .data.PATH == $path and
             .data.MEMO == $memo' \
            <<< "$verify_response" > /dev/null

          {
            echo "## Backend synchronization"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Update package: ${ZIP_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
